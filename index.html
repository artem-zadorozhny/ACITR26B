<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Information</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    select {
      width: 100%;
      max-width: 350px;
      padding: 6px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    #country-info p {
      font-size: 16px;
      margin: 10px 0;
    }
    #flag {
      margin-top: 10px;
      max-width: 250px;
      border: 1px solid #ccc;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Country Information</h1>

  <select id="country-select">
    <option value="">Оберіть країну...</option>
  </select>

  <div id="country-info">
    <p><strong>Країна:</strong> <span id="name">—</span></p>
    <p><strong>Столиця:</strong> <span id="capital">—</span></p>
    <p><strong>Населення:</strong> <span id="population">—</span></p>
    <!-- 3 додаткові параметри на вибір -->
    <p><strong>Регіон:</strong> <span id="region">—</span></p>
    <p><strong>Площа:</strong> <span id="area">—</span></p>
    <p><strong>Валюта:</strong> <span id="currency">—</span></p>
    
    <img id="flag" src="" alt="Прапор країни">
  </div>

  <script src="script.js"></script>
</body>
</html>
