<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Університетський проєкт</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .project-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .university {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 30px;
            color: #000000;
            margin-bottom: 10px;
        }

        .subject {
            font-size: 1.2rem;
            color: #16a085;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .team-section {
            text-align: left;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
        }

        .team-title {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-weight: 600;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            font-size: 1.1rem;
            padding: 8px 0;
            color: #34495e;
            display: flex;
            align-items: center;
        }

        li::before {
            content: "•";
            color: #16a085;
            font-weight: bold;
            display: inline-block; 
            width: 1em;
            margin-left: 5px;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="project-card">
        <div class="university"> <a href="https://vntu.edu.ua/" target="_blank">Вінницький Національний Університет</a></div>
    
        <h1>Веб-технології</h1>
        <div class="subject">Лабораторна работа 1 </div>
        
        <div class="team-section">
            <div class="team-title">Виконали студенти групи 2АКІТР-26Б:</div>
            <ul>
                <li>Задорожний Артем</li>
                <li>Скрипник Ярослав</li>
                 <li>Набуральний Тимофій</li>
            </ul>
        </div>
        
        <!-- Год -->
        <div class="footer">2026 р.</div>
    </div>

</body>
</html>
